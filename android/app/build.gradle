// The app bundles libwwhd.so, built by the repository's top-level CMakeLists.txt. That needs the
// recompiled game code in build/gen (tools/recomp/recomp.py) first.
plugins {
    id 'com.android.application'
}

def shaderTemplate = file((project.findProperty('wwhdShaderTemplate') ?: rootProject.file('../../private/shader-template/template.bin').path) as String)
def templateAssets = layout.buildDirectory.dir('generated/shader-template').get().asFile
def gitBranch = { ->
    try {
        return providers.exec { commandLine 'git', '-C', rootProject.projectDir.path, 'rev-parse', '--abbrev-ref', 'HEAD' }
                .standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        return ''
    }
}()
def publicRelease = project.hasProperty('wwhdPublicRelease') ? project.property('wwhdPublicRelease').toString().toBoolean()
                                                             : (gitBranch == 'android' || gitBranch.startsWith('release-'))

android {
    namespace 'org.wwhdrecomp.app'
    buildFeatures {
        buildConfig true
    }
    // translations (res/values-xx) may cover only part of the texts: the rest shows in English
    lint {
        disable 'MissingTranslation'
    }
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.wwhdrecomp.app'
        minSdk 30          // Vulkan 1.1, AAudio, 39-bit+ address space handling
        targetSdk 36
        // -PwwhdVersionCode / -PwwhdVersionName for a release; raise the code with every APK you share
        versionCode((project.findProperty('wwhdVersionCode') ?: '17') as int)
        versionName project.findProperty('wwhdVersionName') ?: '0.9.7'
        ndk {
            abiFilters 'arm64-v8a'
        }
        // developer tools in Java that published releases leave out (ShaderTour)
        buildConfigField 'boolean', 'PUBLIC_RELEASE', publicRelease.toString()
        externalNativeBuild {
            cmake {
                targets 'wwhd', 'main_hook', 'hook_impl'  // + libadrenotools' hooks (custom GPU drivers)
                arguments '-DANDROID_STL=c++_static'
                // -PwwhdGenDir=<dir>: recompiled code somewhere other than build/gen
                if (project.hasProperty('wwhdGenDir')) arguments "-DGEN_DIR=${project.property('wwhdGenDir')}"
                // -PwwhdGenObjects=<dir>: game code from the LLVM recompiler's objects (testing)
                if (project.hasProperty('wwhdGenObjects')) arguments "-DGEN_OBJECTS=${project.property('wwhdGenObjects')}"
                // -PwwhdDeviceRecomp: no game code in the APK; the app recompiles it on the device
                if (project.hasProperty('wwhdDeviceRecomp')) arguments '-DWWHD_DEVICE_RECOMP=ON'
                // published releases (built from the branches android / release-*, or -PwwhdPublicRelease=true):
                // developer exports such as WWHD_TEMPLATE_EXPORT are off; every other build (tests) keeps them
                if (publicRelease) arguments '-DWWHD_PUBLIC_RELEASE=ON'
            }
        }
    }

    // A release key for APKs you share (-PwwhdDeviceRecomp: no game code in them): android/keystore.properties
    // with storeFile, storePassword, keyAlias, keyPassword. Never commit it or the key; keep both backed
    // up (an app signed with another key can't update it). Without the file, release builds use the
    // local debug key (fine for personal builds of your own game).
    def keystoreProps = rootProject.file('keystore.properties')
    signingConfigs {
        if (keystoreProps.exists()) {
            release {
                def p = new Properties()
                keystoreProps.withInputStream { p.load(it) }
                storeFile file(p.getProperty('storeFile'))
                storePassword p.getProperty('storePassword')
                keyAlias p.getProperty('keyAlias')
                keyPassword p.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps.exists() ? signingConfigs.release : signingConfigs.debug
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        debug {
            // the runtime is unusably slow at -O0; keep debug info but optimize
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=RelWithDebInfo' } }
        }
    }

    // Debug builds only: private assets from outside the repository, never in git or a release APK
    // (e.g. story presets made from other people's saves, for your own testing: assets/presets/*.wwp).
    // -PwwhdPrivateDir=<dir>; default: the folder "private" next to the repository.
    def privateAssets = new File((project.findProperty('wwhdPrivateDir') ?: rootProject.file('../../private').path) as String, 'assets')
    // The shader head start's template (code-free: program hashes, registers, pipeline state; see
    // notes/todo-shader-headstart.md), packaged as assets/shader_template.bin into every build when
    // present. Kept outside the repository. -PwwhdShaderTemplate=<file>; default:
    // private/shader-template/template.bin next to the repository.
    sourceSets {
        main {
            assets.srcDirs += [templateAssets]
        }
        debug {
            if (privateAssets.isDirectory()) assets.srcDirs += [privateAssets]
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            buildStagingDirectory file('../../build/android-cxx')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false   // stored uncompressed and mapped directly from the APK
        }
    }
}

def copyShaderTemplate = tasks.register('copyShaderTemplate', Sync) {
    from(shaderTemplate.exists() ? [shaderTemplate] : []) { rename { 'shader_template.bin' } }
    into templateAssets
    inputs.property('template', shaderTemplate.exists() ? shaderTemplate.path : '')
}
preBuild.dependsOn copyShaderTemplate
