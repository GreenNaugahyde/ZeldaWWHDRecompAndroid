#!/usr/sbin/nft -f
# A closed-by-default firewall for the VPS (fork; docs/online-server-vps.md).
# Open: SSH (rate-limited), HTTP/HTTPS (Caddy: status page + certificates), the game port UDP + TCP (per-address limits).
# Check SSH_PORT and GAME_PORT before loading it. Load and keep it:
#   sudo cp nftables.conf /etc/nftables.conf && sudo nft -c -f /etc/nftables.conf && sudo systemctl enable --now nftables
# fail2ban adds its own table next to this one.

define SSH_PORT = 22
define GAME_PORT = 7777

flush ruleset

table inet filter {
	# addresses sending more game packets than any honest game (per_ip players x packets_per_s, with room)
	set game_flood {
		type ipv4_addr; flags dynamic, timeout; timeout 1m;
	}
	set game_flood6 {
		type ipv6_addr; flags dynamic, timeout; timeout 1m;
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif "lo" accept
		ct state established,related accept
		ct state invalid drop

		# ping and the ICMP that IPv6 and path MTU need, limited
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 10/second accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } limit rate 50/second accept

		# SSH: new connections at most 6 a minute per address
		tcp dport $SSH_PORT ct state new meter ssh4 { ip saddr limit rate 6/minute burst 6 packets } accept
		tcp dport $SSH_PORT ct state new meter ssh6 { ip6 saddr limit rate 6/minute burst 6 packets } accept

		# Caddy: the status page and Let's Encrypt
		tcp dport { 80, 443 } ct state new accept
		udp dport 443 accept   # HTTP/3

		# the game, UDP: one address over 400 packets/s is dropped for a minute (an honest game sends ~15-60)
		udp dport $GAME_PORT ip saddr @game_flood drop
		udp dport $GAME_PORT ip6 saddr @game_flood6 drop
		udp dport $GAME_PORT meter gflood4 { ip saddr limit rate over 400/second burst 200 packets } add @game_flood { ip saddr } drop
		udp dport $GAME_PORT meter gflood6 { ip6 saddr limit rate over 400/second burst 200 packets } add @game_flood6 { ip6 saddr } drop
		udp dport $GAME_PORT accept

		# the game, TCP fallback: at most 8 open connections per address, new ones 20 a minute
		tcp dport $GAME_PORT ct state new meter gtcp4 { ip saddr ct count over 8 } reject with tcp reset
		tcp dport $GAME_PORT ct state new meter gtcp6 { ip6 saddr ct count over 8 } reject with tcp reset
		tcp dport $GAME_PORT ct state new meter gtcpr4 { ip saddr limit rate 20/minute burst 10 packets } accept
		tcp dport $GAME_PORT ct state new meter gtcpr6 { ip6 saddr limit rate 20/minute burst 10 packets } accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}
