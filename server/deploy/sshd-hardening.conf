# SSH: keys only, no root (fork; docs/online-server-vps.md). Copy to /etc/ssh/sshd_config.d/10-hardening.conf
# ONLY AFTER your own key login works for your non-root sudo user; then: sudo sshd -t && sudo systemctl reload ssh
# Keep the current SSH session open until a new login works.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
# AllowUsers yourname
